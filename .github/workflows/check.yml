name: Verificar Creative OS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
        streamlit: ['1.67.0']
    env:
      PUENTE_REQUIRE_CRYPTO_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-test-oidc.txt
      - run: python -m pip install 'streamlit==${{ matrix.streamlit }}'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
