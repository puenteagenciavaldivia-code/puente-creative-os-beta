name: Verificar Creative OS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.9'
            streamlit: '1.42.2'
          - python: '3.12'
            streamlit: '1.67.0'
    env:
      PUENTE_REQUIRE_CRYPTO_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-test-oidc.txt
      - run: python -m pip install 'streamlit==${{ matrix.streamlit }}' 'Authlib==1.3.2'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
