name: DCP creative dossier validation
on:
  pull_request:
    paths:
      - 'dossier_engine.py'
      - 'creative_dossier_bridge.py'
      - 'pages/03_Dossier_creativo.py'
      - 'carousel_quality_gate.py'
      - 'tests/test_carousel_quality_gate.py'
      - 'tests/test_dossier_integration.py'
      - '.github/workflows/dcp-tests.yml'
  workflow_dispatch:
jobs:
  dcp-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modules
        run: python -m py_compile dossier_engine.py creative_dossier_bridge.py carousel_quality_gate.py pages/03_Dossier_creativo.py tests/test_dossier_integration.py tests/test_carousel_quality_gate.py
      - name: Install beta dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full beta regression suite
        run: python -m unittest discover -s tests -v
