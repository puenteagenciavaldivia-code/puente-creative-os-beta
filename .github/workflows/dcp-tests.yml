name: DCP creative dossier validation
on:
  pull_request:
    paths:
      - 'dossier_engine.py'
      - 'creative_dossier_bridge.py'
      - 'tests/test_dossier_integration.py'
      - '.github/workflows/dcp-tests.yml'
  workflow_dispatch:
jobs:
  dcp-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modules
        run: python -m py_compile dossier_engine.py creative_dossier_bridge.py tests/test_dossier_integration.py
      - name: Run isolated DCP tests
        run: python -m unittest discover -s tests -p 'test_dossier_integration.py' -v
