name: PUENTE 04.01 auditoria aislada
on:
  push:
    branches:
      - 'audit/0401-native-and-streamlit-20261119'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del laboratorio
        run: python -m pip install -r requirements.txt
      - name: Ejecutar las 28 pruebas autenticas del motor
        run: python -m unittest discover -s tests -p test_decision_store.py -v 2>&1 | tee native-tests.log
      - name: Comprobar importacion y flujo inicial Streamlit
        run: |
          python - <<'PY' 2>&1 | tee streamlit-smoke.log
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=25).run()
          if at.exception:
              raise AssertionError("Streamlit exception: " + repr(at.exception))
          print("STREAMLIT_SMOKE_OK")
          print("TITLE:", [x.value for x in at.title])
          print("BUTTONS:", [x.label for x in at.button])
          PY
      - name: Conservar evidencia sin datos de clientes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puente-0401-audit-logs
          path: |
            native-tests.log
            streamlit-smoke.log
          if-no-files-found: warn
          retention-days: 14
